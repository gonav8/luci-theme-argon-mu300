name: Build and release OpenWrt APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: OpenWrt 25.12.x SDK version
        required: true
        default: '25.12.2'
        type: string
      release_tag:
        description: Existing release tag to upload to (leave empty to use the latest tag)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APKv3 package (OpenWrt 25.12.x)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout theme source
        uses: actions/checkout@v4
        with:
          path: theme-source

      - name: Set release variables
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "sdk_version=${{ inputs.sdk_version }}" >> "$GITHUB_OUTPUT"
            tag="${{ inputs.release_tag }}"
            [[ -n "$tag" ]] || tag="v$(grep -oP '^PKG_VERSION:=\K.*' theme-source/Makefile)-r$(grep -oP '^PKG_RELEASE:=\K.*' theme-source/Makefile)"
          else
            echo "sdk_version=25.12.2" >> "$GITHUB_OUTPUT"
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Package release tag: $tag"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget

      - name: Download OpenWrt SDK
        shell: bash
        env:
          SDK_VERSION: ${{ steps.release.outputs.sdk_version }}
        run: |
          set -euo pipefail
          sdk_url="$(python3 - <<'PY'
          import os, re
          from urllib.request import urlopen
          version = os.environ['SDK_VERSION']
          if not version.startswith('25.12.'):
              raise SystemExit('Only OpenWrt 25.12.x SDK versions are supported')
          base = f'https://downloads.openwrt.org/releases/{version}/targets/x86/64/'
          page = urlopen(base, timeout=30).read().decode()
          matches = re.findall(r'href="([^"]*openwrt-sdk-' + re.escape(version) + r'-x86-64_[^"]+_musl\.Linux-x86_64\.tar\.zst)"', page)
          if len(matches) != 1:
              raise SystemExit(f'Expected one SDK archive under {base}; found {matches}')
          print(base + matches[0])
          PY
          )"
          wget -q "$sdk_url" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm sdk.tar.zst

      - name: Install LuCI feed and theme package
        run: |
          cd sdk
          ./scripts/feeds update luci
          ./scripts/feeds install luci-base
          mkdir -p package/luci-theme-argon
          cp -a ../theme-source/. package/luci-theme-argon/
          echo 'CONFIG_PACKAGE_luci-theme-argon=m' > .config
          make defconfig

      - name: Compile APK
        run: |
          cd sdk
          make package/luci-theme-argon/clean
          make package/luci-theme-argon/compile -j"$(nproc)" V=s
          mkdir -p ../release-assets
          apk_file="$(find bin/packages -type f -name 'luci-theme-argon*.apk' -print -quit)"
          test -n "$apk_file"
          package_version="$(grep -oP '^PKG_VERSION:=\K.*' ../theme-source/Makefile)"
          package_release="$(grep -oP '^PKG_RELEASE:=\K.*' ../theme-source/Makefile)"
          cp -v "$apk_file" "../release-assets/luci-theme-argon-${package_version}-r${package_release}.apk"
          (cd ../release-assets && sha256sum *.apk > SHA256SUMS)

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Argon MU300 $TAG" --notes-file theme-source/MU300.md
          fi
          gh release upload "$TAG" release-assets/*.apk release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
